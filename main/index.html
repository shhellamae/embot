<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embot bayot</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="petals" aria-hidden="true">
        <!-- SET 1 -->
        <span style="--x:5%; --d:13s; --s:0s"><img src="image.png" alt=""></span>
        <span style="--x:75%; --d:17s; --s:3s"><img src="e1.png" alt=""></span>
        <span style="--x:25%; --d:15s; --s:6s"><img src="e2.png" alt=""></span>
        <span style="--x:90%; --d:19s; --s:2s"><img src="e3.png" alt=""></span>
        <span style="--x:45%; --d:16s; --s:8s"><img src="e4.png" alt=""></span>
        <span style="--x:20%; --d:18s; --s:11s"><img src="e5.png" alt=""></span>
        <span style="--x:60%; --d:14s; --s:5s"><img src="e6.png" alt=""></span>
        <span style="--x:85%; --d:21s; --s:9s"><img src="e7.png" alt=""></span>
        <span style="--x:35%; --d:16s; --s:12s"><img src="e8.png" alt=""></span>
        <span style="--x:10%; --d:20s; --s:4s"><img src="e9.png" alt=""></span>
        <span style="--x:70%; --d:15s; --s:7s"><img src="e10.png" alt=""></span>

        <!-- SET 2 -->
        <span style="--x:85%; --d:18s; --s:5s"><img src="image.png" alt=""></span>
        <span style="--x:15%; --d:14s; --s:10s"><img src="e1.png" alt=""></span>
        <span style="--x:65%; --d:20s; --s:1s"><img src="e2.png" alt=""></span>
        <span style="--x:30%; --d:16s; --s:12s"><img src="e3.png" alt=""></span>
        <span style="--x:95%; --d:21s; --s:7s"><img src="e4.png" alt=""></span>
        <span style="--x:55%; --d:13s; --s:15s"><img src="e5.png" alt=""></span>
        <span style="--x:5%; --d:19s; --s:8s"><img src="e6.png" alt=""></span>
        <span style="--x:40%; --d:17s; --s:3s"><img src="e7.png" alt=""></span>
        <span style="--x:80%; --d:22s; --s:11s"><img src="e8.png" alt=""></span>
        <span style="--x:25%; --d:15s; --s:14s"><img src="e9.png" alt=""></span>
        <span style="--x:72%; --d:18s; --s:6s"><img src="e10.png" alt=""></span>

        <!-- SET 3 -->
        <span style="--x:40%; --d:15s; --s:4s"><img src="image.png" alt=""></span>
        <span style="--x:90%; --d:19s; --s:13s"><img src="e1.png" alt=""></span>
        <span style="--x:10%; --d:17s; --s:9s"><img src="e2.png" alt=""></span>
        <span style="--x:70%; --d:22s; --s:15s"><img src="e3.png" alt=""></span>
        <span style="--x:20%; --d:18s; --s:11s"><img src="e4.png" alt=""></span>
        <span style="--x:80%; --d:14s; --s:16s"><img src="e5.png" alt=""></span>
        <span style="--x:30%; --d:20s; --s:12s"><img src="e6.png" alt=""></span>
        <span style="--x:95%; --d:16s; --s:18s"><img src="e7.png" alt=""></span>
        <span style="--x:15%; --d:21s; --s:17s"><img src="e8.png" alt=""></span>
        <span style="--x:60%; --d:13s; --s:19s"><img src="e9.png" alt=""></span>
        <span style="--x:45%; --d:18s; --s:20s"><img src="e10.png" alt=""></span>

        <div class="image-container">
            <img src="image.png" class="bounce-pop" alt="">
        </div>
    </div>

    <!-- Spinning Pop-up Text -->
    <div class="pop-container">
        <h1 class="spinning-pop-text" id="mainTitle">Embot bayot?</h1>
        <!-- Hidden success message text -->
        <div id="successMessage" class="success-text" style="display: none;">
             <!-- <img src="e5.png"> -->
        </div>
    </div>

    <!-- Final Reveal Image (Hidden by default, fades in slowly) -->
    <div id="revealContainer" class="reveal-container" style="display: none;">
        <img src="e7.png" alt="Special Reveal" class="reveal-img">
    </div>

    <!-- Button Container with both Yes and No -->
    <div class="button-container" id="buttonContainer">
        <button id="yesBtn" class="btn btn-pink px-4 py-2 shadow-sm">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <!-- Hidden Audio Element for Background Song -->
    <audio id="bgSong" src="emo.mp3" loop></audio>

    

    <!-- External Script -->
    <script src="script.js"></script>
</body>
</html>
